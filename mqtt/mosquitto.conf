# xiao-seat-vision — Eclipse Mosquitto 2.0.x
#
# Listeners
#   8883  MQTT over TLS. Published by compose.yaml for the ESP32 (LAN).
#   1883  plaintext, ONLY for containers on the internal Docker network
#         (healthcheck / optional internal clients). compose.yaml never
#         publishes it to the host.
#
# Security
#   - anonymous access disabled, password file (PBKDF2-SHA512 hashes)
#   - per-device topic ACL (username == device_id)
#   - persistence on: QoS 1 messages for the bridge's persistent session survive
#     a broker restart (autosave every 60 s — see docs/architecture.md for limits)

per_listener_settings false
allow_anonymous false
password_file /mosquitto/secrets/passwd
acl_file /mosquitto/config/acl

persistence true
persistence_location /mosquitto/data/
autosave_interval 60

# Queue limits for disconnected persistent clients (the bridge)
max_queued_messages 5000
max_inflight_messages 20
# Snapshots are ~15-30 KB base64 JSON; reject anything absurd
message_size_limit 524288

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# ---- TLS listener (ESP32, bridge) ----
listener 8883
protocol mqtt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
# Only needed when clients present certificates; harmless otherwise.
cafile /mosquitto/certs/ca.crt
tls_version tlsv1.2
require_certificate false

# ---- internal plaintext listener (NOT published to the host) ----
listener 1883
protocol mqtt
